<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Electrician (Bijli Mistri) working with circuits, wires and pliers">
  <defs>
    <linearGradient id="electrician-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bulb-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#electrician-bg)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.25" />

  <!-- Circuit grid pattern -->
  <g stroke="#fef08a" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M10,15 L40,15 L48,23 L48,45" />
    <path d="M90,85 L60,85 L52,77 L52,55" />
    <circle cx="48" cy="45" r="2" fill="#ef4444" />
    <circle cx="52" cy="55" r="2" fill="#ef4444" />
  </g>

  <!-- Colorful Insulated Wires -->
  <g id="circuit-wires" stroke-linecap="round" fill="none" stroke-width="3">
    <!-- Red phase wire -->
    <path d="M10,75 Q35,70 50,55" stroke="#ef4444" />
    <!-- Blue neutral wire -->
    <path d="M15,82 Q40,78 55,62" stroke="#3b82f6" />
    <!-- Yellow earth wire -->
    <path d="M20,89 Q45,86 60,69" stroke="#eab308" />
    
    <!-- Copper exposed tips -->
    <line x1="50" y1="55" x2="54" y2="51" stroke="#d97706" stroke-width="2" />
    <line x1="55" y1="62" x2="59" y2="58" stroke="#d97706" stroke-width="2" />
    <line x1="60" y1="69" x2="64" y2="65" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Glowing Filament Bulb -->
  <g transform="translate(48, 12)">
    <!-- Glow aureole -->
    <circle cx="15" cy="15" r="16" fill="#fef08a" fill-opacity="0.12" filter="blur(2px)" />
    <!-- Glass globe -->
    <circle cx="15" cy="15" r="10" fill="none" stroke="url(#bulb-glow)" stroke-width="1.5" />
    <path d="M10,23 L20,23 L18,28 L12,28 Z" fill="#94a3b8" stroke="#475569" stroke-width="0.5" />
    <!-- Filament -->
    <path d="M12,18 L14,12 L16,12 L18,18" fill="none" stroke="#f59e0b" stroke-width="1" />
  </g>

  <!-- Lightning Spark symbol -->
  <polygon points="76,14 63,30 71,30 67,46 80,30 72,30" fill="#facc15" filter="drop-shadow(0px 0px 4px rgba(250, 204, 21, 0.4))" />

  <!-- Insulated Lineman's Pliers -->
  <g transform="translate(50, 48) rotate(-15)">
    <!-- Metallic jaws -->
    <path d="M16,6 L22,6 L20,16 L14,16 Z" fill="url(#steel)" stroke="#475569" stroke-width="0.5" />
    <path d="M22,6 L28,6 L24,16 L18,16 Z" fill="url(#steel)" stroke="#475569" stroke-width="0.5" />
    <!-- Pivot joint -->
    <circle cx="19" cy="17" r="2.5" fill="#475569" />
    
    <!-- Red insulated grips/handles -->
    <path d="M15,18 C12,26 8,36 10,44" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
    <path d="M23,18 C26,26 30,36 28,44" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Slip-guard flare -->
    <rect x="13" y="18" width="3" height="1.5" fill="#facc15" />
    <rect x="22" y="18" width="3" height="1.5" fill="#facc15" />
  </g>
</svg>
