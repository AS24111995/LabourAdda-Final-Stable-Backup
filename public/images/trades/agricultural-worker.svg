<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Agricultural Worker (Kheti Mazdoor) harvesting crop fields with sickle">
  <defs>
    <linearGradient id="agri-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wheat-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sickle-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="url(#agri-bg)" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" />

  <!-- Agricultural field rows (perspective lines) -->
  <g stroke="#10b981" stroke-opacity="0.12" stroke-width="1" fill="none">
    <line x1="50" y1="50" x2="5" y2="95" />
    <line x1="50" y1="50" x2="25" y2="95" />
    <line x1="50" y1="50" x2="50" y2="95" />
    <line x1="50" y1="50" x2="75" y2="95" />
    <line x1="50" y1="50" x2="95" y2="95" />
    <circle cx="50" cy="45" r="2" fill="#eab308" />
  </g>

  <!-- Traditional Straw Farmer Hat (Pugree / Pagri style or Straw Hat) -->
  <g transform="translate(14, 12)">
    <!-- Broad rim -->
    <ellipse cx="20" cy="18" rx="15" ry="6" fill="#f59e0b" stroke="#b45309" stroke-width="0.75" />
    <!-- Hat dome -->
    <path d="M12,16 C12,8 28,8 28,16 Z" fill="#d97706" stroke="#b45309" stroke-width="0.75" />
    <!-- Ribbon -->
    <path d="M11.5,16 Q20,18 28.5,16" stroke="#b91c1c" stroke-width="1.5" fill="none" />
  </g>

  <!-- Growing Golden Wheat Stalks (Gehun ki Baali) -->
  <g transform="translate(54, 15)">
    <!-- Main stem -->
    <path d="M15,75 Q18,40 10,12" fill="none" stroke="url(#wheat-gold)" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Wheat grains/ears branching off the stem -->
    <!-- Left side grains -->
    <path d="M10,12 Q4,10 6,14 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M11,20 Q5,18 7,22 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M13,28 Q7,26 9,30 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M14,36 Q8,34 10,38 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M15,44 Q9,42 11,46 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    
    <!-- Right side grains -->
    <path d="M10,12 Q16,8 14,13 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M11,18 Q18,15 15,20 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M12,26 Q20,23 17,28 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M13,34 Q21,31 18,36 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M14,42 Q22,39 19,44 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
  </g>

  <!-- Second, smaller wheat stalk -->
  <g transform="translate(74, 25) scale(0.8)">
    <path d="M10,75 Q15,40 5,12" fill="none" stroke="url(#wheat-gold)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M5,12 Q-1,10 1,14 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M6,20 Q0,18 2,22 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M5,12 Q11,8 9,13 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
    <path d="M6,18 Q13,15 10,20 Z" fill="url(#wheat-gold)" stroke="#78350f" stroke-width="0.25" />
  </g>

  <!-- Traditional Harvesting Sickle (Hansiya / Daranti) -->
  <g transform="translate(18, 55) rotate(-10)">
    <!-- Metal crescent blade -->
    <path d="M12,24 C12,10 32,8 34,22 C34,25 30,28 24,24 C20,21 16,21 15,24 Z" fill="url(#sickle-metal)" stroke="#334155" stroke-width="0.75" />
    <!-- Serrated inner edge line -->
    <path d="M16,23 C18,20 22,20 24,22" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" fill="none" />
    
    <!-- Wooden Handle shank -->
    <rect x="8" y="24" width="5" height="12" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5" />
    <!-- Rivet connection to blade -->
    <circle cx="10.5" cy="26" r="0.75" fill="#f59e0b" />
  </g>
</svg>
